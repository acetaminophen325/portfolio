<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="author" content="Jovan Ng">
  <meta name="description" content="Contact Page">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Jovan's Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar red-block">
    <div class="container">
      <a href="index.html" class="logo">Jovan's Portfolio</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <div class="menu-toggle">☰</div>

  <main>
    <!-- Added hero section -->
    <section class="hero">
      <h1>Contact Me</h1>
      <p>Let's collaborate on something amazing!</p>
    </section>

    <!-- Updated form section -->
    <section class="white-block">
      <h2>Get in Touch</h2>
      <form action="#" method="post">
        <div class="form-group">
          <label for="name">Your Name:</label>
          <input type="text" id="name" name="name" required aria-required="true">
        </div>
        
        <div class="form-group">
          <label for="email">Your Email:</label>
          <input type="email" id="email" name="email" required aria-required="true">
        </div>

        <div class="form-group">
          <label for="subject">Subject:</label>
          <input type="text" id="subject" name="subject" required aria-required="true">
        </div>

        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required aria-required="true"></textarea>
        </div>

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer class="black-block">
    <div class="social-links">
      <a href="https://github.com/acetaminophen325" aria-label="GitHub">
        <em class="fab fa-github"></em>
      </a>
      <a href="https://linkedin.com/in/jovan-ng-5a5652226" aria-label="LinkedIn">
        <em class="fab fa-linkedin"></em>
      </a>
    </div>
    <p>&copy; 2025 Jovan Ng | <a href="contact.html">Contact Me</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
